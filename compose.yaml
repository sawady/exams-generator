# The server alone, as always:
#   docker compose up -d --build
# The server plus the isolated demo runner (set EXAMS_RUN_DEMOS=true in .env):
#   docker compose --profile demos up -d --build
# With gVisor as the runner's runtime, if runsc is installed (see "Running demos" in README):
#   docker compose -f compose.yaml -f compose.gvisor.yaml --profile demos up -d --build
services:
  exams-generator:
    build: .
    image: exams-generator:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # run_demos never executes anything in this container: it sends runs to the runner.
      # Without the "demos" profile the runner is not there, and runs are reported skipped.
      EXAMS_RUN_RUNNER_URL: http://runner:8766
    ports:
      # Bind to localhost and put a TLS reverse proxy in front for remote use.
      - "127.0.0.1:${EXAMS_HTTP_PORT:-8765}:8765"
    volumes:
      # Your exams. Point this at a clone of your private exams repository.
      - ${EXAMS_HOST_DIR:-./exams}:/exams
      # Optional overrides: course.md, style/, templates/, pandoc-header.tex.
      - ${EXAMS_HOST_DATA_DIR:-./data}:/data:ro
      # Optional, for EXAMS_GIT_PUSH=true: an SSH deploy key for the exams repo.
      # - ~/.ssh/exams_deploy_key:/home/exams/.ssh/id_ed25519:ro
    networks:
      - default
      - runner

  # Executes run_demos runs and nothing else. It gets no .env, no volume and no token,
  # and the only network it is on is internal: it can answer the server, nothing more.
  runner:
    profiles: [demos]
    build:
      context: .
      dockerfile: Dockerfile.runner
    image: exams-generator-runner:latest
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /input:size=16m,mode=1777
      - /work:size=256m,mode=1777,exec
      - /tmp:size=64m,mode=1777
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    environment:
      EXAMS_RUN_TIMEOUT: "30"
      EXAMS_RUN_MEMORY_MB: "4096"
    networks:
      - runner

networks:
  runner:
    # No route out: neither the runner nor the code it runs can reach the internet.
    internal: true
