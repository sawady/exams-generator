# Run the demo runner under gVisor: its system calls go to gVisor's own kernel instead
# of the host's. Needs runsc installed and registered with Docker (see README).
#   docker compose -f compose.yaml -f compose.gvisor.yaml --profile demos up -d --build
services:
  runner:
    runtime: runsc
    environment:
      # gVisor hides the host's pids cgroup from the container, but its RLIMIT_NPROC
      # counts only the sandbox's own processes, so the runner limits them with it.
      EXAMS_RUNNER_NPROC: "128"
