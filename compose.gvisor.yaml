# Run the demo runner under gVisor: its system calls go to gVisor's own kernel instead
# of the host's. Needs runsc installed and registered with Docker (see README).
#   docker compose -f compose.yaml -f compose.gvisor.yaml --profile demos up -d --build
services:
  runner:
    runtime: runsc
    environment:
      # gVisor applies pids_limit outside the sandbox, where the runner cannot see it.
      # A run that reaches it takes the sandbox down: Docker restarts the runner and
      # the server reports that run as skipped.
      EXAMS_RUNNER_PIDS_LIMIT_OUTSIDE: "true"
