name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      # GCC/G++ come with the runner; GHC and pandoc do not, so those tests skip here.
      - run: pytest -rs

  toolchains:
    name: All toolchains
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GHC, pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghc pandoc \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-lang-spanish lmodern ghostscript
      - name: Install bubblewrap for the demo sandbox
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -e ".[dev]"
      - name: Every checker must be available
        run: |
          python - <<'PY'
          from exams_generator.checkers import CheckerRegistry
          from exams_generator.pdf import toolchain_status
          from exams_generator.sandbox import Sandbox
          rows = CheckerRegistry().describe()
          missing = [r["language"] for r in rows if not r["available"]]
          assert not missing, f"missing toolchains: {missing}"
          assert toolchain_status()["available"], "pandoc/pdflatex missing"
          sandbox = Sandbox().status()
          assert sandbox.available, f"sandbox missing: {sandbox.hint}"
          # The demo tests skip when the sandbox cannot see a toolchain: not here.
          from tests.conftest import demo_toolchain_problem
          problems = [demo_toolchain_problem(lang) for lang in ("python", "haskell", "c", "cpp")]
          problems = [p for p in problems if p]
          assert not problems, f"demo toolchains outside the sandbox: {problems}"
          PY
      - name: Spanish PDFs use babel-spanish
        run: kpsewhich spanish.ldf
      - run: pytest -rs

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel installs and has its assets
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-check/bin/python -c "
          from exams_generator.content import Content
          from pathlib import Path
          assert Content(Path('/tmp/nothing')).style_guide('c', 'en')
          "

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t exams-generator:ci .
      - name: Smoke test
        run: |
          docker run -d --name eg -p 8765:8765 -e EXAMS_BEARER_TOKEN=ci exams-generator:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/mcp)" = 401
          docker logs eg

  runner:
    name: Demo runner (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, gvisor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install gVisor
        if: matrix.runtime == 'gvisor'
        run: |
          curl -fsSL --retry 5 https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases 20261026 main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list
          # Only gVisor's repository: the runner image does its own apt, inside Docker.
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/gvisor.list \
            -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y runsc
          sudo runsc install
          sudo systemctl restart docker
          runsc --version
          echo "COMPOSE_FILE=compose.yaml:compose.gvisor.yaml" >> "$GITHUB_ENV"
          echo "EXAMS_E2E_GVISOR=1" >> "$GITHUB_ENV"
      - name: Start the server and the runner
        run: |
          token="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$token"
          echo "EXAMS_E2E_TOKEN=$token" >> "$GITHUB_ENV"
          # A runner that dies mid-run leaves the request hanging until this timeout.
          printf 'EXAMS_BEARER_TOKEN=%s\nEXAMS_RUN_DEMOS=true\nEXAMS_GIT_BACKUP=false\nEXAMS_RUN_RUNNER_TIMEOUT=90\n' "$token" > .env
          # The server runs as UID 1000 and writes the exams here.
          mkdir -p exams data && chmod 777 exams
          docker compose --profile demos up -d --build --wait
      - name: The runner uses the expected runtime
        run: |
          runtime="$(docker inspect --format '{{.HostConfig.Runtime}}' "$(docker compose --profile demos ps -q runner)")"
          echo "runtime: $runtime"
          if [ "${{ matrix.runtime }}" = gvisor ]; then test "$runtime" = runsc; else test "$runtime" != runsc; fi
      - name: End to end, runner up
        env:
          EXAMS_E2E_URL: http://127.0.0.1:8765/mcp
          EXAMS_E2E_RUNNER: up
        run: pytest -rs tests/test_runner_e2e.py
      - run: docker compose --profile demos stop runner
      - name: End to end, runner stopped
        env:
          EXAMS_E2E_URL: http://127.0.0.1:8765/mcp
          EXAMS_E2E_RUNNER: down
        run: pytest -rs tests/test_runner_e2e.py
      - name: Logs
        if: always()
        run: docker compose --profile demos logs
